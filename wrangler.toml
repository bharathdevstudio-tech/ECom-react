# Cloudflare Workers deployment configuration for Nova Store.
#
# The app stores its data in Cloudflare D1 (SQLite) through the `DB` binding.
# Cloudflare's Git-integrated builds run `npm run build && npx wrangler deploy`
# on every push, so a push to `master` is all that is needed to release.
#
# `main` and `[assets]` are managed by the Cloudflare Vite plugin
# (see vite.config.ts / workers/app.ts), so they are intentionally absent here.

name = "ecom-react"
main = "./workers/app.ts"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]

# The catalog (~1000 products + reviews) seeds itself automatically on first
# request. Seeding is resumable, so the free plan's per-invocation query limit
# is respected: the first few page loads return a partially-seeded catalog and
# fill in the rest as you browse. No manual migration step is required.

[[d1_databases]]
binding = "DB"
database_name = "nova-store"
database_id = "fb3f0902-8740-4f4e-a9d3-dd00d3e49841"

[observability]
enabled = true
